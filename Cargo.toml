[package]
name = "tavern-brawl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Text-action arena game where every move is judged by TypeSafe's Jev model"
license = "MIT"
publish = false

[dependencies]
typesafe-ai-sdk = "0.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[[bin]]
name = "tavern-brawl"
path = "src/main.rs"

[[bin]]
name = "ping"
path = "src/bin/ping.rs"
